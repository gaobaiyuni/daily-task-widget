<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小组件背景 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e8e9f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 30px;
    gap: 30px;
  }

  /* 模拟手机桌面背景 */
  .desktop {
    width: 360px;
    background: linear-gradient(160deg, #f0e6d8 0%, #d8c4b0 100%);
    border-radius: 30px;
    padding: 30px 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  }

  /* 小组件卡片 - 图片铺满背景 */
  .widget {
    position: relative;
    width: 100%;
    aspect-ratio: 5 / 2;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  }

  .widget .bg {
    position: absolute;
    inset: 0;
    background-image: url('widget_bg_demo.jpg');
    background-size: cover;
    background-position: center;
  }

  /* 半透明蒙版，提升文字可读性 */
  .widget .mask {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.15) 40%, rgba(255,255,255,0.25) 100%);
  }

  .widget .content {
    position: absolute;
    inset: 0;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* 顶部日期行 */
  .widget .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .widget .date {
    color: #5c7a99;
    font-size: 12px;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(255,255,255,0.6);
  }
  .widget .clock {
    color: #5c7a99;
    font-size: 13px;
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(255,255,255,0.6);
  }

  /* 当前任务 */
  .widget .now-label {
    color: #5c7a99;
    font-size: 13px;
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(255,255,255,0.6);
    margin-bottom: 2px;
  }
  .widget .task {
    color: #4a6b8a;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.2;
    text-shadow: 0 1px 3px rgba(255,255,255,0.75);
  }

  .hint {
    color: #555;
    font-size: 14px;
    text-align: center;
    line-height: 1.7;
  }
</style>
</head>
<body>

  <div class="desktop">
    <!-- 小组件 demo -->
    <div class="widget">
      <div class="bg"></div>
      <div class="mask"></div>
      <div class="content">
        <div class="top">
          <span class="date">今天 · 11月24日 周二</span>
          <span class="clock">10:04</span>
        </div>
        <div>
          <div class="now-label">现在 · 10:00 - 11:00</div>
          <div class="task">准备周会材料</div>
        </div>
      </div>
    </div>
  </div>

  <div class="hint">
    这是小组件背景图的预览效果（5×2 卡片比例）<br>
    浅灰蓝 / 雾蓝文字 + 一层半透明白色蒙版，保证在图上清晰可读
  </div>

</body>
</html>
